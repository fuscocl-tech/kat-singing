# Firebase App Hosting settings. https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0
  maxInstances: 2

env:
  - variable: ADMIN_PASSWORD
    secret: admin-password
  - variable: SESSION_SECRET
    secret: session-secret
  - variable: STUDIO_NAME
    value: Kat's Singing Studio
  - variable: STUDIO_TIMEZONE
    value: Australia/Sydney
